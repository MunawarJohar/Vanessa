<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Acute Preventive Health</title>
<meta name="description" content="Get in touch with Acute Preventive Health about the CA-EMSA approved Preventive Health and Safety training.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <nav aria-label="Primary">
      <ul class="nav-links">
        <li><a href="resources.html">Resources</a></li>
        <li><a href="faq.html">FAQ</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
        <li><a href="reschedule.html">Reschedule</a></li>
      </ul>
    </nav>
    <a href="index.html" class="brand">
      <img class="brand-mark" src="assets/logo.webp" alt="Acute Preventive Health logo">
    </a>
    <a href="index.html#book" class="btn">Book Your Class Now</a>
  </div>
</header>

<main class="page-body">
  <div class="container contact-wrap">
    <h1>Contact Us</h1>
    <p class="lede">The best way to get ahold of us is to send us a message here and we will promptly respond. All responses will arrive in your email inbox.</p>

    <!--
      Static hosting (GitHub Pages / Vercel) can't process form submissions on its own.
      This form posts to Formspree as a drop-in handler — swap in your own endpoint,
      or wire it to Acuity/your CRM instead. Replace YOUR_FORM_ID below.
    -->
    <form class="form-grid" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <div class="form-row">
        <div class="field">
          <label for="first-name">First Name <span class="req">(required)</span></label>
          <input type="text" id="first-name" name="first_name" required>
        </div>
        <div class="field">
          <label for="last-name">Last Name <span class="req">(required)</span></label>
          <input type="text" id="last-name" name="last_name" required>
        </div>
      </div>

      <div class="field">
        <label for="email">Email <span class="req">(required)</span></label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone">
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message"></textarea>
      </div>

      <div class="form-submit">
        <button type="submit" class="btn">Submit</button>
      </div>
    </form>
  </div>
</main>

<footer class="site-footer" id="footer-placeholder"></footer>

<script src="footer.js"></script>
<script src="script.js"></script>
</body>
</html>
