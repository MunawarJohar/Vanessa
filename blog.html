<!--
  Sanity blog feed — swap in your real project ID and dataset below
  (find both in sanity.io/manage). No build step required: this
  hits Sanity's public CDN API directly from the static page.
-->
<script>
(function () {
  var SANITY_PROJECT_ID = 'YOUR_PROJECT_ID';
  var SANITY_DATASET = 'production';

  var query = encodeURIComponent(
    '*[_type == "post"] | order(publishedAt desc){title, slug, publishedAt, excerpt, "coverImageUrl": coverImage.asset->url}'
  );
  var url = 'https://' + SANITY_PROJECT_ID + '.apicdn.sanity.io/v2024-01-01/data/query/' + SANITY_DATASET + '?query=' + query;

  var listEl = document.getElementById('post-list');

  if (SANITY_PROJECT_ID === 'YOUR_PROJECT_ID') {
    listEl.innerHTML = '<p>We don\'t have any posts published yet &mdash; check back soon.</p>';
    return;
  }

  fetch(url)
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var posts = data.result || [];
      if (!posts.length) {
        listEl.innerHTML = '<p>We don\'t have any posts published yet &mdash; check back soon.</p>';
        return;
      }
      listEl.style.textAlign = 'left';
      listEl.innerHTML = posts.map(function (post) {
        var date = post.publishedAt
          ? new Date(post.publishedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
          : '';
        return (
          '<article style="padding:24px 0; border-bottom:1px solid var(--line);">' +
            (post.coverImageUrl ? '<img src="' + post.coverImageUrl + '?w=800&auto=format" alt="" style="width:100%; border-radius:6px; margin-bottom:16px;">' : '') +
            '<h2 style="font-family:var(--font-display); font-size:24px; margin:0 0 6px;">' + post.title + '</h2>' +
            '<p style="font-size:13px; color:#777; margin:0 0 10px;">' + date + '</p>' +
            '<p style="margin:0;">' + (post.excerpt || '') + '</p>' +
          '</article>'
        );
      }).join('');
    })
    .catch(function () {
      listEl.innerHTML = '<p>Couldn\'t load posts right now &mdash; please check back shortly.</p>';
    });
})();
</script>
